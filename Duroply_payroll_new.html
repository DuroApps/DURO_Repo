<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duroply Factory Payroll - Shapar</title>
<!-- Supabase JS v2, same build as the App Launcher (index.html) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.1/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#1F2421; --ink2:#5A605C; --line:#D5D8D3; --panel:#F2F3F0; --paper:#FFFFFF;
  --side:#2F3230; --side-ink:#ECEBE1; --kpi:#3A3A3A; --ivory:#FFFFF0;
  --accent:#23604B; --accent-ink:#FFFFFF; --warn:#9A6212; --warn-bg:#FFF4DF; --err:#A8261B; --err-bg:#FDECEA; --ok:#23604B; --ok-bg:#E6F1EC;
  --font:Calibri, Carlito, "Segoe UI", Arial, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:var(--font);font-size:14px;color:var(--ink);background:var(--panel)}
button,input,select,textarea{font-family:var(--font);font-size:14px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Layout */
#app{display:grid;grid-template-columns:186px 1fr;grid-template-rows:auto 1fr;height:100%}
#side{grid-row:1/3;background:var(--side);color:var(--side-ink);overflow-y:auto;padding:16px 0}
#side .brand{padding:0 14px 12px;border-bottom:1px solid #474a48;margin-bottom:8px}
#side .brand b{display:block;font-size:17px;letter-spacing:.2px}
#side .brand .logo{display:block;opacity:1;margin:0 0 10px;line-height:0}
#side .brand .logo img{display:block;width:150px;max-width:100%;height:auto}
#side .brand .logo .wm{display:inline-block;line-height:1;font-weight:700;font-size:21px;letter-spacing:2.5px;color:var(--ivory);padding:5px 9px 4px;border:1.5px solid var(--ivory);border-radius:3px}
#side .brand span{font-size:12px;opacity:.75}
#side h4{margin:12px 14px 3px;font-size:12px;font-weight:600;opacity:.6}
#side a{display:block;padding:5px 14px;font-size:13.5px;color:var(--side-ink);text-decoration:none;border-left:3px solid transparent}
#side a:hover{background:#3a3d3b}
#side a.on{background:#3f4341;border-left-color:#C9C3A2;font-weight:600}
#top{background:var(--paper);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
#main{overflow:auto;padding:16px 18px 0}
.monthpick{display:flex;align-items:center;gap:8px}
.monthpick label{color:var(--ink2)}
.who{margin-left:auto;color:var(--ink2);display:flex;gap:10px;align-items:center}

/* Month status stepper */
.steps{display:flex;align-items:center;gap:0}
.steps span{padding:4px 10px;font-size:12px;border:1px solid var(--line);margin-left:-1px;color:var(--ink2);background:#fafaf8}
.steps span:first-child{border-radius:4px 0 0 4px}
.steps span:last-child{border-radius:0 4px 4px 0}
.steps span.done{background:#E6EAE3;color:var(--ink)}
.steps span.cur{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* Content */
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--ink2);margin:0 0 16px}
h2{font-size:16px;margin:22px 0 8px}
.titlerow{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap;margin-bottom:4px}
.titlerow h1{margin:0;white-space:nowrap}
.titlerow .sub{margin:0}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 12px}
.bar .grow{flex:1}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 12px;border-radius:4px;cursor:pointer}
.btn:hover{border-color:#9aa19c}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.dan{color:var(--err);border-color:#e3b7b2}
.btn.sm{padding:3px 8px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],input[type=password],input[type=email],select,textarea{border:1px solid var(--line);border-radius:4px;padding:5px 8px;background:#fff;color:var(--ink)}
input.bad{border-color:var(--err);background:var(--err-bg)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:14px}
.note{background:var(--warn-bg);border:1px solid #efd9ad;color:#5b3e0c;padding:8px 12px;border-radius:4px;margin:8px 0}
.okmsg{background:var(--ok-bg);border:1px solid #b8d6c8;color:#18402f;padding:8px 12px;border-radius:4px;margin:8px 0}
.errmsg{background:var(--err-bg);border:1px solid #efc2bd;color:#6d1a12;padding:8px 12px;border-radius:4px;margin:8px 0}
.muted{color:var(--ink2)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;border:1px solid var(--line);background:#f7f7f5}
.pill.Active,.pill.ok{background:var(--ok-bg);border-color:#b8d6c8}
.pill.Pending,.pill.warn{background:var(--warn-bg);border-color:#efd9ad}
.pill.Left,.pill.err{background:var(--err-bg);border-color:#efc2bd}

/* KPI cards: dark grey, light ivory figures */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0 18px}
.kpi{background:var(--kpi);color:var(--ivory);border-radius:6px;padding:14px 16px}
.kpi .v{font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;opacity:.85;margin-top:4px}

/* Tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:4px;background:var(--paper);max-height:68vh}
table.g{border-collapse:collapse;width:100%;font-size:13px}
table.g th{position:sticky;top:0;background:#E7E9E4;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600;z-index:1}
table.g td{padding:4px 8px;border-bottom:1px solid #ECEDEA;white-space:nowrap}
table.g tr:hover td{background:#FAFAF6}
table.g td.n,table.g th.n{text-align:right;font-variant-numeric:tabular-nums}
table.g tr.tot td{font-weight:700;background:#EEF0EB;border-top:2px solid #9aa19c}
table.g tr.sub td{font-weight:600;background:#F6F7F4}
table.g tr.err td{background:var(--err-bg)}
table.g tr.warn td{background:var(--warn-bg)}
table.g input{width:62px;padding:2px 4px;text-align:right}
table.g td.rc{background:#F6F8F5}
table.att th,table.att td{padding:3px 4px}
table.att input{width:38px;padding:2px 3px;font-size:13px}
table.att input[data-k="act_ot_hrs"]{width:44px}
table.att td.nm{white-space:normal;min-width:130px;max-width:190px;line-height:1.2}
table.att td.chk{white-space:normal;min-width:200px;max-width:320px;font-size:12px;color:var(--ink2)}
table.g tr.err td.chk{color:var(--err)}
table.g th.rc{background:#DDE3DA}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(31,36,33,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:6px;max-width:980px;width:100%;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
#modal h3{margin:0 0 12px;font-size:18px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink2)}
.form label b{color:var(--err);font-weight:400}
.form fieldset{grid-column:1/-1;border:none;border-top:1px solid var(--line);margin:6px 0 0;padding:8px 0 0}
.form legend{font-weight:600;color:var(--ink);padding-right:8px}
.form .full{grid-column:1/-1}
.form .ferr{color:var(--err);font-size:12px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* Login */
#gate{position:fixed;inset:0;background:var(--panel);display:flex;align-items:center;justify-content:center;z-index:60}
#gate .box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:26px 28px;width:min(520px,92vw)}
#gate h1{margin-bottom:2px}

/* Save bar: stays at the bottom of the screen while there are unsaved rows */
.savebar{position:sticky;bottom:0;z-index:4;display:flex;gap:10px;align-items:center;background:#2F3230;color:#fff;padding:9px 14px;border-radius:6px 6px 0 0;margin-top:10px;box-shadow:0 -4px 14px rgba(0,0,0,.15)}
.savebar[hidden]{display:none}
.savebar .btn{border-color:#6b706c}
.pagepad{height:50px}
#toast{position:fixed;right:18px;top:84px;display:flex;flex-direction:column;gap:8px;z-index:70}
#toast div{background:#2F3230;color:#fff;padding:10px 14px;border-radius:4px;max-width:420px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
#toast div.e{background:var(--err)}

/* Print */
.printhead{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff}
  #side,#top,.bar,.noprint,#toast{display:none!important}
  #app{display:block}
  #main{padding:0;overflow:visible}
  .tw{max-height:none;overflow:visible;border:none}
  table.g{font-size:9.5px}
  table.g th{position:static}
  .printhead{display:block}
  .kpi{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:820px){
  #app{grid-template-columns:1fr}
  #side{grid-row:auto;max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="gate" hidden></div>
<div id="app" hidden>
  <nav id="side"></nav>
  <header id="top"></header>
  <main id="main"></main>
</div>
<div id="modal"><div class="box" id="mbox"></div></div>
<div id="toast"></div>

/* Finds the company department / designation for a name from the factory master (case-insensitive, known spellings) */
function matchName(list, value, alias) {
  const v = String(value || '').trim(); if (!v) return null;
  const target = (alias[v.toUpperCase()] || v).toLowerCase();
  return list.find(x => String(x.name || '').trim().toLowerCase() === target) || null;

/* Sets department_id / designation_id and the exact company names on employee rows; returns names not found */
function linkEmployees(rows, depts, desgs) {
  const miss = { dept: new Set(), desg: new Set() };
  rows.forEach(e => {
    if (e.dept_name) { const d = matchName(depts, e.dept_name, DEPT_ALIAS); if (d) { e.department_id = d.id; e.dept_name = d.name; } else { e.department_id = null; miss.dept.add(e.dept_name); } }

  });
  return miss;
}

function takeHandoff() {
  let h = null, src = '';

  if (!h && /access_token=/.test(location.hash)) {
    const q = new URLSearchParams(location.hash.slice(1));
    h = { access_token: q.get('access_token'), refresh_token: q.get('refresh_token'), ts: Date.now() }; src = 'url';
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
  if (h && src === 'storage' && h.ts && Date.now() - h.ts > HANDOFF_MAX_AGE_MS) h = null;   // left over from an old launch

/* ===================== Pay month calendar (system driven) ===================== */
const nextMonth = iso => { const y = +iso.slice(0, 4), m = +iso.slice(5, 7); return m === 12 ? `${y + 1}-01-01` : `${y}-${String(m + 1).padStart(2, '0')}-01`; };
const addMonths = (iso, k) => { let y = +iso.slice(0, 4), m = +iso.slice(5, 7) - 1 + k; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return `${y}-${String(m + 1).padStart(2, '0')}-01`; };
const thisCalMonth = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`; };
const prevCalMonth = () => addMonths(thisCalMonth(), -1);
const WEEKDAY = { SUN: 0, MON: 1, TUE: 2, WED: 3, THU: 4, FRI: 5, SAT: 6 };
/* Days, weekly offs and company holidays for a month. Holidays come from the holiday master;
   a holiday on the weekly off is not counted twice. */
function monthCalendar(iso, hol, P) {
  const end = monthEnd(iso), dim = +end.slice(8), wd = WEEKDAY[String(P.WEEKLY_OFF || 'SUN').toUpperCase()];
  const isOff = ds => wd !== undefined && new Date(ds.slice(0, 10) + 'T00:00:00Z').getUTCDay() === wd;
  let offs = 0; for (let dd = 1; dd <= dim; dd++) if (isOff(`${iso.slice(0, 8)}${String(dd).padStart(2, '0')}`)) offs++;
  const h = hol.filter(x => x.holiday_date >= iso && x.holiday_date <= end && x.holiday_type !== 'Other' && !isOff(x.holiday_date)).length;
  return { from_date: iso, to_date: end, days_in_month: dim, weekly_offs: offs, holidays: h, expected_days: dim - offs - h };
}
/* Returns the pay_period row for a month, creating it on first use and keeping its calendar
   in line with the holiday master while the month is still open for changes. */
async function ensurePeriod(iso, quiet, startFirst) {
  S.blockReason = null; S.firstMonth = false; if (!iso) return null;
  const [periods, hol, params] = await Promise.all([load('period'), load('hol'), load('param')]);
  const cal = monthCalendar(iso, hol, Engine.resolveParams(params, iso));
  let p = periods.find(x => x.pay_month === iso);
  if (p) {
    const changed = num(p.days_in_month) !== cal.days_in_month || num(p.holidays) !== cal.holidays || num(p.expected_days) !== cal.expected_days || num(p.weekly_offs) !== cal.weekly_offs;
    if (changed && editableStatus(p.status)) {
      const np = { ...p, ...cal }; delete np.created_at; delete np.updated_at;
      await DB.put('period', [np]);
      await audit('pay_period', iso, 'calendar', JSON.stringify({ holidays: p.holidays, expected_days: p.expected_days }), JSON.stringify({ holidays: cal.holidays, expected_days: cal.expected_days }), 'Holiday master changed');
      if (p.status !== 'Open') { await DB.del('line', { pay_month: iso }); await setStatus(np, 'Open', {}, 'Calendar changed'); if (!quiet) toast(`${monthLabel(iso)} calendar changed (holidays now ${cal.holidays}). The month is back to Open; check attendance and calculate again.`); }
      p = (await load('period', { pay_month: iso }))[0];
    }
    return p;
  }
  // new month: months are processed in sequence
  const sorted = periods.map(x => x.pay_month).sort();
  // The first month sets where payroll history begins, so it needs an explicit Start with confirmation.
  if (!sorted.length && !startFirst) { S.blockReason = `No payroll month exists yet. ${monthLabel(iso)} can be started as the first month with the Start button.`; S.firstMonth = true; return null; }
  const last = sorted[sorted.length - 1];
  if (last && iso < last) { S.blockReason = `${monthLabel(iso)} is before the first month in the system (${monthLabel(sorted[0])}) and cannot be started.`; if (iso > sorted[0]) S.blockReason = `${monthLabel(iso)} was not processed and cannot be started now. Months are processed in sequence.`; return null; }
  if (last) {
    const lp = periods.find(x => x.pay_month === last);
    if (nextMonth(last) !== iso) { S.blockReason = `Process ${monthLabel(nextMonth(last))} first. Months are processed in sequence.`; return null; }
    if (!['Approved', 'Locked'].includes(lp.status)) { S.blockReason = `${monthLabel(last)} is ${lp.status}. It must be Approved before ${monthLabel(iso)} can start.`; return null; }
  }
  if (!can('periodOpen')) { S.blockReason = `${monthLabel(iso)} has not started. The Payroll Operator starts it by selecting the month.`; return null; }
  if (iso > thisCalMonth()) { S.blockReason = `${monthLabel(iso)} is a future month.`; return null; }
  const rec = { pay_month: iso, ...cal, status: 'Open' };
  await DB.put('period', [rec]); await audit('pay_period', iso, 'status', null, 'Open', `Month started: ${cal.days_in_month} days, ${cal.weekly_offs} weekly offs, ${cal.holidays} holidays`);
  if (!quiet) toast(`${monthLabel(iso)} started: ${cal.days_in_month} days, ${cal.holidays} company holiday(s), ${cal.expected_days} working days.`);
  return rec;
}
async function syncOpenCalendars() {   // after a holiday or weekly-off change
  const periods = await load('period');
  for (const p of periods.filter(x => editableStatus(x.status))) await ensurePeriod(p.pay_month);
  await renderTop();
}
async function curPeriod() { return S.month ? (await load('period', { pay_month: S.month }))[0] || null : null; }
async function renderTop() {
  const periods = await load('period');
  const p = periods.find(x => x.pay_month === S.month);
  const si = p ? STATUS.indexOf(p.status) : -1;
  // calendar months: from the first month in the system (or 12 months back) to the current month
  const cur = thisCalMonth(), first = periods.map(x => x.pay_month).sort()[0];
  let from = first && first < addMonths(cur, -12) ? first : addMonths(cur, -12);
  const months = []; for (let m = cur; m >= from; m = addMonths(m, -1)) months.push(m);
  periods.forEach(x => { if (!months.includes(x.pay_month)) months.push(x.pay_month); });
  if (S.month && !months.includes(S.month)) months.push(S.month);
  months.sort().reverse();
  const stat = m => { const x = periods.find(y => y.pay_month === m); return x ? x.status : 'Not started'; };
  $('#top').innerHTML = `<div class="monthpick"><label for="mSel">Pay month</label>
      <select id="mSel">${months.map(m => `<option value="${m}" ${m === S.month ? 'selected' : ''}>${monthLabel(m)} (${stat(m)})</option>`).join('')}</select>
      ${p ? `<span class="muted">${isoToDMY(p.from_date)} to ${isoToDMY(p.to_date)}: ${p.days_in_month} days, ${num(p.weekly_offs)} weekly offs, ${num(p.holidays)} holidays, ${days(p.expected_days)} working days</span>` : ''}</div>
    <div class="steps" aria-label="Month status">${STATUS.map((s, i) => `<span class="${i < si ? 'done' : i === si ? 'cur' : ''}">${s}</span>`).join('')}</div>
    <div class="who">${esc(S.user)} <span class="pill">${esc(S.role)}</span>${DB.mode === 'local' ? '<span class="pill warn">Standalone: data on this computer only</span>' : ''}</div>`;
  $('#mSel').onchange = e => { const m = e.target.value;
    leaveCheck(async () => { S.unsaved = null; S.month = m; try { await ensurePeriod(S.month); } catch (x) { toast(x.message, true); } await renderTop(); go(S.page, true); }, () => { e.target.value = S.month; }); };
}
const PAGES = {};
/* Unsaved-changes guard: a grid page sets S.unsaved (count) and S.saveFn (save) */
function leaveCheck(next, onCancel) {
  const n = S.unsaved ? S.unsaved() : 0; if (!n) return next();
  confirmBox('Unsaved changes', `${n} row(s) on this screen are not saved. Save them first, or leave without saving?`, async () => { S.unsaved = null; S.saveFn = null; await next(); }, { yes: 'Leave without saving', danger: true });
  const c = $('#cNo'); if (c && onCancel) c.addEventListener('click', onCancel);
}
window.addEventListener('beforeunload', e => { if (S.unsaved && S.unsaved()) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && S.saveFn) { e.preventDefault(); S.saveFn(); } });
async function go(p, force) {
  if (!force && S.unsaved && S.unsaved()) return leaveCheck(() => go(p, true));
  S.unsaved = null; S.saveFn = null;
  S.page = p; renderSide();
  $('#main').innerHTML = '<p class="muted">Loading...</p>';
  try { await PAGES[p](); } catch (e) { console.error(e); $('#main').innerHTML = `<div class="errmsg">${esc(e.message || e)}</div>`; }
}

function modal(html) { $('#mbox').innerHTML = html; $('#modal').classList.add('show'); const f = $('#mbox').querySelector('input,select'); if (f) f.focus(); }
function closeModal() { $('#modal').classList.remove('show'); $('#mbox').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').classList.contains('show')) closeModal(); });

/* field: {k, l, t: text|int|num|date|yn|sel|upper, req, opts:[[v,l]], ro, help, full} */
function fieldHtml(f, v) {
  const id = 'f_' + f.k, req = f.req ? ' <b>*</b>' : '', ro = f.ro ? 'disabled' : '';
  let inp;
  if (f.t === 'yn') inp = `<select id="${id}" ${ro}><option value="Y" ${v === 'Y' ? 'selected' : ''}>Y</option><option value="N" ${v === 'N' ? 'selected' : ''}>N</option></select>`;
  else if (f.t === 'sel') inp = `<select id="${id}" ${ro}><option value=""></option>${f.opts.map(([a, b]) => `<option value="${esc(a)}" ${String(a) === String(v ?? '') ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select>`;
  else if (f.t === 'date') inp = `<input type="text" id="${id}" value="${esc(isoToDMY(v))}" placeholder="DD-MM-YYYY" ${ro}>`;
  else if (f.t === 'area') inp = `<textarea id="${id}" rows="2" ${ro}>${esc(v)}</textarea>`;
  else inp = `<input type="text" id="${id}" value="${esc(v)}" ${ro} ${f.t === 'int' || f.t === 'num' ? 'inputmode="decimal"' : ''}>`;
  return `<label class="${f.full ? 'full' : ''}"><span>${esc(f.l)}${req}</span>${inp}<span class="ferr" id="e_${f.k}"></span>${f.help ? `<span class="muted">${esc(f.help)}</span>` : ''}</label>`;
}
function readForm(fields) {
  const out = {}, errs = {};
  fields.forEach(f => {
    const el = document.getElementById('f_' + f.k); if (!el) return;
    let v = el.value.trim();
    if (f.t === 'upper' || f.upper) v = v.toUpperCase();
    if (f.t === 'date') { const d = dmyToIso(v); if (d === undefined) errs[f.k] = 'Use DD-MM-YYYY'; v = d; }
    else if (f.t === 'int') { if (v === '') v = null; else if (!/^-?\d+$/.test(v)) errs[f.k] = 'Whole number only'; else v = Number(v); }
    else if (f.t === 'num') { if (v === '') v = null; else if (isNaN(Number(v))) errs[f.k] = 'Number only'; else v = Number(v); }
    else if (v === '') v = null;
    if (f.req && (v === null || v === '')) errs[f.k] = 'Required';
    out[f.k] = v;
  });
  return { out, errs };
}
function showErrs(errs) {
  document.querySelectorAll('#mbox .ferr').forEach(e => e.textContent = '');
  document.querySelectorAll('#mbox .bad').forEach(e => e.classList.remove('bad'));
  Object.entries(errs).forEach(([k, m]) => { const e = document.getElementById('e_' + k); if (e) e.textContent = m; const i = document.getElementById('f_' + k); if (i) i.classList.add('bad'); });
  return Object.keys(errs).length === 0;
}
function confirmBox(title, text, onYes, opt = {}) {
  modal(`<h3>${esc(title)}</h3><p>${text}</p>${opt.reason ? `<div class="form"><label class="full">Reason <b>*</b><input type="text" id="cReason"></label></div>` : ''}
    <div class="mfoot"><button class="btn" id="cNo">Cancel</button><button class="btn ${opt.danger ? 'dan' : 'pri'}" id="cYes">${esc(opt.yes || 'Confirm')}</button></div>`);
  $('#cNo').onclick = closeModal;
  $('#cYes').onclick = async () => { const r = opt.reason ? $('#cReason').value.trim() : null; if (opt.reason && !r) { $('#cReason').classList.add('bad'); return; }
    try { await onYes(r); closeModal(); } catch (e) { toast(e.message || String(e), true); } };
}

async function simplePage(t) {
  const M = SIMPLE[t]; const rows = (await load(t)).sort((a, b) => a[M.sort] < b[M.sort] ? -1 : 1);
  const ed = can('masterEdit');
  $('#main').innerHTML = `<h1>${M.title}</h1><p class="sub">${esc(M.sub || '')}</p>
    <div class="bar">${ed ? `<button class="btn pri" id="bAdd">Add</button>` : ''}<input type="text" id="q" placeholder="Search"><span class="grow"></span><span class="muted">${rows.length} records</span></div>
    <div class="tw"><table class="g"><thead><tr>${M.fields.map(f => `<th>${esc(f.l)}</th>`).join('')}<th></th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const draw = () => { const q = $('#q').value.toLowerCase();
    $('#tb').innerHTML = rows.filter(r => !q || M.fields.some(f => String(r[f.k] ?? '').toLowerCase().includes(q))).map((r, i) =>
      `<tr>${M.fields.map(f => `<td>${esc(f.t === 'date' ? isoToDMY(r[f.k]) : r[f.k])}</td>`).join('')}<td>${ed ? `<button class="btn sm" data-e="${rows.indexOf(r)}">Edit</button> <button class="btn sm dan" data-d="${rows.indexOf(r)}">Delete</button>` : ''}</td></tr>`).join('') || `<tr><td colspan="9" class="muted">No records. Use Add to create one.</td></tr>`;
    $('#tb').querySelectorAll('[data-e]').forEach(b => b.onclick = () => edit(rows[b.dataset.e]));
    $('#tb').querySelectorAll('[data-d]').forEach(b => b.onclick = () => del(rows[b.dataset.d])); };
  $('#q').oninput = draw; draw();
  if (ed) $('#bAdd').onclick = () => edit(null);
  function edit(r) {
    const fields = M.fields.map(f => ({ ...f, ro: f.key && r }));
    modal(`<h3>${r ? 'Edit' : 'Add'} ${esc(M.title.replace(/s$/, '').toLowerCase())}</h3><div class="form">${fields.map(f => fieldHtml(f, r ? r[f.k] : (f.t === 'yn' ? 'Y' : ''))).join('')}</div>
      <div class="mfoot"><button class="btn" id="mC">Cancel</button><button class="btn pri" id="mS">Save</button></div>`);
    $('#mC').onclick = closeModal;
    $('#mS').onclick = async () => {
      const { out, errs } = readForm(fields.filter(f => !f.ro)); if (r) M.fields.filter(f => f.key).forEach(f => out[f.k] = r[f.k]);
      const keyF = M.fields.find(f => f.key);
      if (!r && rows.find(x => String(x[keyF.k]) === String(out[keyF.k]))) errs[keyF.k] = 'Already exists';
      if (!showErrs(errs)) return;
      try { await DB.put(t, [out]); await auditDiff(TBL[t].t, out[keyF.k], r, out, M.fields.map(f => f.k)); closeModal(); toast('Saved'); if (t === 'hol') await syncOpenCalendars(); go(t); } catch (e) { toast(e.message, true); }
    };
  }
  async function del(r) {
    const keyF = M.fields.find(f => f.key);
    if (await M.used(r)) return toast(`${r[keyF.k]} is in use and cannot be deleted. Set Active to N instead.`, true);
    confirmBox('Delete record', `Delete <b>${esc(r[keyF.k])}</b>? This cannot be undone.`, async () => {
      await DB.del(t, { [keyF.k]: r[keyF.k] }); await audit(TBL[t].t, r[keyF.k], '*', JSON.stringify(r), null, 'Deleted'); toast('Deleted'); if (t === 'hol') await syncOpenCalendars(); go(t);
    }, { danger: true, yes: 'Delete' });
  }
}

/* Next free Ticket No. in a category: highest 5-digit ticket of that category plus 1, skipping any used number */
function nextTicket(all, cat) {
  const used = new Set(all.map(x => Number(x.token_no))), same = all.filter(x => Number(x.cat_code) === Number(cat)).map(x => Number(x.token_no)).filter(x => x >= 10000 && x <= 99999);
  if (!same.length) return '';
  let t = Math.max(...same) + 1; while (used.has(t)) t++; return t <= 99999 ? t : '';
}
function validateEmp(e, all, isNew, orig) {
  const er = {}, others = all.filter(x => String(x.token_no) !== String(e.token_no) && !transferLinked(x, e));
  if (e.token_no != null && !/^\d{5}$/.test(String(e.token_no))) er.token_no = '5 digits';
  if (isNew && all.find(x => String(x.token_no) === String(e.token_no))) er.token_no = 'Ticket No. already exists';
  if (e.uan_no) { if (!/^\d{12}$/.test(e.uan_no)) er.uan_no = '12 digits'; else if (others.find(x => x.uan_no === e.uan_no)) er.uan_no = 'UAN used by another worker'; }
  if (e.adhaar_no) { if (!/^\d{12}$/.test(e.adhaar_no)) er.adhaar_no = '12 digits'; else if (others.find(x => x.adhaar_no === e.adhaar_no)) er.adhaar_no = 'Aadhaar used by another worker'; }
  if (e.pf_no && others.find(x => x.pf_no === e.pf_no)) er.pf_no = 'PF No. used by another worker';
  if (e.pan_no && !/^[A-Z]{5}\d{4}[A-Z]$/.test(e.pan_no)) er.pan_no = 'Pattern AAAAA9999A';
  if (e.ifsc_code && !/^[A-Z]{4}0[A-Z0-9]{6}$/.test(e.ifsc_code)) er.ifsc_code = '11 characters, 5th character zero';
  if (e.mobile && !/^\d{10}$/.test(e.mobile)) er.mobile = '10 digits';
  if (e.d_o_l && e.d_o_j && e.d_o_l < e.d_o_j) er.d_o_l = 'Before date of joining';
  if (e.d_o_r && e.d_o_j && e.d_o_r < e.d_o_j) er.d_o_r = 'Before date of joining';
  if (String(e.cat_code) === '3' && !e.cont_code) er.cont_code = 'Required for Supply Workers';
  if (e.pay_type === 'M' && !num(e.new_basic)) er.new_basic = 'Required for monthly pay type';
  if (e.status === 'Left' && !e.d_o_l) er.d_o_l = 'Required when status is Left';
  if (e.pf === 'Y' && !e.uan_no) er.uan_no = 'Required when PF is Y';
  // minimum age: checked for a new worker, and when the date of birth or joining is changed
  if (e.d_o_b && (isNew || !orig || orig.d_o_b !== e.d_o_b || orig.d_o_j !== e.d_o_j)) {
    if (e.d_o_b > todayIso()) er.d_o_b = 'Date of birth is in the future';
    else { const on = e.d_o_j || todayIso(), age = ageOn(e.d_o_b, on);
      if (age < MIN_AGE) er.d_o_b = `Age is ${Math.max(0, age)} years on ${isoToDMY(on)}${e.d_o_j ? ' (date of joining)' : ''}. Minimum age is ${MIN_AGE} years`; }
  }
  return er;
}

/* Casual Worker to Permanent Worker. The casual record is closed (status Left, date of leaving the
   day before the transfer) and a new Permanent record is created with a new Ticket No. and the same

async function transferEmp(e, all, R) {
  const PERM = 1, permName = (R.cat.find(c => Number(c.cat_code) === PERM) || {}).cat_name || 'PERMANENT WORKER';
  const used = new Set(all.map(x => Number(x.token_no)));
  let sug = Math.max(0, ...all.filter(x => Number(x.cat_code) === PERM).map(x => Number(x.token_no))) + 1;
  while (used.has(sug)) sug++; if (sug < 10000 || sug > 99999) sug = '';
  const rates = await load('rate', { token_no: e.token_no }), cur = Engine.resolveRate(rates, e.token_no, '9999-12-01');
  const isM = e.pay_type === 'M';
  const F = [{ k: 'new_token', l: 'New Ticket No. (Permanent)', t: 'int', req: 1, help: sug ? 'Next free number after the last Permanent ticket' : '' },
    { k: 't_date', l: 'Transfer date (joins as Permanent)', t: 'date', req: 1, help: 'Casual record closes the day before' },
    isM ? { k: 'new_sal', l: 'Monthly salary from transfer, Rs.', t: 'num', req: 1 } : { k: 'new_rate', l: 'DIL daily rate from transfer, Rs.', t: 'num', req: 1 }];
  const init = { new_token: sug, t_date: S.month || null, new_rate: num(cur ? cur.dil_rate : e.rate) || '', new_sal: num(cur ? cur.monthly_salary : e.new_basic) || '' };
  modal(`<h3>Transfer to Permanent Worker</h3><p>Ticket <b>${e.token_no} ${esc(e.name)}</b>, ${esc(e.cat_name || 'Casual Worker')}, joined ${isoToDMY(e.d_o_j)}.</p>
    <div class="form">${F.map(f => fieldHtml(f, init[f.k])).join('')}</div>
    <p class="muted">The casual ticket becomes Left on the day before the transfer date. A new Permanent ticket is created with the same personal, bank, PF, UAN, Aadhaar and leave balance details, joining on the transfer date. The contractor is cleared. The new rate is saved in Rate history from the 1st of the transfer month.${can('approve') ? '' : ' The new ticket and rate are saved as Pending for HR Checker approval.'}</p>
    <div class="mfoot"><button class="btn" id="mC">Cancel</button><button class="btn pri" id="mS">Transfer</button></div>`);
  $('#mC').onclick = closeModal;

    if (td && e.d_o_l && td > addDaysIso(e.d_o_l, 1)) errs.t_date = `The casual record already has a date of leaving ${isoToDMY(e.d_o_l)}`;
    if (!isM && out.new_rate != null && !(num(out.new_rate) > 0)) errs.new_rate = 'More than 0';
    if (isM && out.new_sal != null && !(num(out.new_sal) > 0)) errs.new_sal = 'More than 0';
    if (!showErrs(errs)) return;
    const m1 = td.slice(0, 8) + '01';
    if ((await load('period')).some(p => ['Approved', 'Locked'].includes(p.status) && p.pay_month >= m1)) return toast(`${monthLabel(m1)} or a later month is Approved or Locked. Choose a transfer date in a month that is still open.`, true);
    const laterAtt = (await load('att', { token_no: e.token_no })).filter(a => a.pay_month > m1 && !attBlank(a));
    if (laterAtt.length) return toast(`Ticket ${e.token_no} has attendance after ${monthLabel(m1)} (${laterAtt.map(a => monthLabel(a.pay_month)).join(', ')}). Remove it first.`, true);
    const lvRows = (await load('leave', { token_no: e.token_no })).sort((a, b) => a.month_year < b.month_year ? -1 : 1); await lvLoadOpening();
    const lv = lvCurrent(e, lvRows), ap = can('approve'), now = new Date().toISOString();
    const oldRec = { ...e, status: 'Left', d_o_l: addDaysIso(td, -1), reason: TRANSFER_TAG(nt) };
    const newRec = { ...e, token_no: Number(nt), cat_code: PERM, cat_name: permName, d_o_j: td, d_o_l: null, reason: null, status: ap ? 'Active' : 'Pending',
      cont_code: 0, cont_name: null, rate: ap && !isM ? num(out.new_rate) : 0, new_basic: isM ? num(out.new_sal) : e.new_basic, pl_clb: lv.pl, cl_clb: lv.cl };
    [oldRec, newRec].forEach(r => { delete r.created_at; delete r.updated_at; });
    const v = validateEmp(newRec, all.map(x => x.token_no === e.token_no ? oldRec : x), true);
    if (Object.keys(v).length) return toast(`The new Permanent record fails a check: ${Object.values(v).join('; ')}. Correct the casual record first.`, true);
    const rateRow = { token_no: Number(nt), effective_from: m1, dil_rate: isM ? 0 : num(out.new_rate), monthly_salary: isM ? num(out.new_sal) : 0, entered_by: S.user, approved_by: ap ? S.user : null, approved_on: ap ? now : null };
    confirmBox('Confirm transfer', `Ticket <b>${e.token_no}</b> (Casual) becomes Left on <b>${isoToDMY(oldRec.d_o_l)}</b>. New Permanent ticket <b>${nt}</b> joins on <b>${isoToDMY(td)}</b> at ${isM ? 'monthly salary' : 'DIL rate'} Rs. ${inr(isM ? rateRow.monthly_salary : rateRow.dil_rate)}, with PL ${lvDays(lv.pl) || 0} and CL ${lvDays(lv.cl) || 0} days carried over.${td.slice(8) !== '01' ? ` In ${monthLabel(m1)} both tickets are paid: the casual ticket for days up to ${isoToDMY(oldRec.d_o_l)}, the Permanent ticket from ${isoToDMY(td)}.` : ''}`, async () => {
      try {

        await audit('rajkot_emp_master', e.token_no, 'status', e.status || 'Active', 'Left', TRANSFER_TAG(nt));
        await audit('rajkot_emp_master', nt, '*', null, `From casual ticket ${e.token_no}`, 'Created by transfer to Permanent');
        await audit('pay_rate_history', `${nt}/${m1}`, isM ? 'monthly_salary' : 'dil_rate', null, isM ? rateRow.monthly_salary : rateRow.dil_rate, 'Rate on transfer to Permanent');
        toast(`Transferred. New Permanent ticket ${nt}${ap ? '' : ' saved as Pending'}.`); go('emp');
      } catch (x) { toast(x.message, true); }
    }, { yes: 'Transfer' });
  };
}

    $('#tb').querySelectorAll('[data-e]').forEach(b => b.onclick = () => edit(rates[b.dataset.e]));
    $('#tb').querySelectorAll('[data-d]').forEach(b => b.onclick = () => del(rates[b.dataset.d])); };
  $('#q').oninput = draw; $('#fAp').oninput = draw; $('#fDp').oninput = draw; draw();
  $('#bExp').onclick = () => download('emp_rate_history.csv', toCsv(['token_no', 'effective_from', 'dil_rate', 'monthly_salary', 'entered_by', 'approved_by'], rates.map(r => ({ ...r, effective_from: isoToDMY(r.effective_from) }))), 'text/csv');
  const lockedFrom = async eff => (await load('period')).some(p => ['Approved', 'Locked'].includes(p.status) && p.pay_month >= eff);
  async function syncMaster(token) {   // master.rate / new_basic show the latest approved rate
    const rs = (await load('rate', { token_no: token })).filter(r => r.approved_by).sort((a, b) => a.effective_from < b.effective_from ? 1 : -1)[0];
    const e = (await load('emp', { token_no: token }))[0]; if (!e || !rs) return;
    if (num(e.rate) !== num(rs.dil_rate) || num(e.new_basic) !== num(rs.monthly_salary)) await DB.put('emp', [{ ...e, rate: num(rs.dil_rate), new_basic: num(rs.monthly_salary) }]);
  }
  function edit(r) {
    const tokOpts = emps.filter(e => (e.status || 'Active') !== 'Left' || (r && e.token_no == r.token_no)).sort((a, b) => a.token_no - b.token_no)
      .map(e => [e.token_no, `${e.token_no} - ${e.name}${e.status === 'Pending' ? ' (Pending)' : ''}`]);
    if (r && !tokOpts.some(o => o[0] == r.token_no)) tokOpts.unshift([r.token_no, `${r.token_no} - (not in master)`]);
    const depts = [...new Set(emps.map(e => e.dept_name).filter(Boolean))].sort(), curDept = r ? ((emps.find(e => e.token_no == r.token_no) || {}).dept_name || '') : '';
    const F = [{ k: 'dept_f', l: 'Department (filters the worker list)', t: 'sel', ro: !!r, opts: depts.map(d => [d, d]) },
      { k: 'token_no', l: 'Worker (Ticket No. - Name)', t: 'sel', req: 1, ro: !!r, opts: tokOpts }, { k: 'effective_from', l: 'Effective from (1st of month)', t: 'date', req: 1, ro: !!r },
      { k: 'dil_rate', l: 'DIL daily rate (8-hour), Rs.', t: 'num' }, { k: 'monthly_salary', l: 'Monthly salary, Rs. (pay type M)', t: 'num' }];
    modal(`<h3>${r ? 'Edit' : 'Add'} rate</h3><div class="form">${F.map(f => fieldHtml(f, r ? r[f.k] : (f.k === 'effective_from' && S.month ? S.month : ''))).join('')}</div>
      <p class="muted">${can('approve') ? 'Saved as approved.' : 'Saved as pending until the HR Checker approves it.'}</p>
      <div class="mfoot"><button class="btn" id="mC">Cancel</button><button class="btn pri" id="mS">Save</button></div>`);
    $('#mC').onclick = closeModal;
    if (r) { const d = $('#f_dept_f'); if (d) d.value = curDept; }
    else $('#f_dept_f').onchange = () => {   // worker list shows only the chosen department, in Ticket No. order
      const dn = $('#f_dept_f').value, sel = $('#f_token_no');
      sel.innerHTML = '<option value=""></option>' + tokOpts.filter(o => !dn || (emps.find(e => e.token_no == o[0]) || {}).dept_name === dn).map(([a, b]) => `<option value="${esc(a)}">${esc(b)}</option>`).join('');
    };
    $('#mS').onclick = async () => {
      const { out, errs } = readForm(F.filter(f => !f.ro)); delete out.dept_f; const rec = { ...(r || {}), ...out }; if (r) { rec.token_no = r.token_no; rec.effective_from = r.effective_from; }
      if (rec.effective_from && rec.effective_from.slice(8) !== '01') errs.effective_from = 'Use the first day of the month';
      if (!r && !emps.find(e => e.token_no == rec.token_no)) errs.token_no = 'Not in employee master';
      if (!r && rates.find(x => x.token_no == rec.token_no && x.effective_from === rec.effective_from)) errs.effective_from = 'A rate already exists for this month';
      if (!num(rec.dil_rate) && !num(rec.monthly_salary)) errs.dil_rate = 'Enter a DIL rate or a monthly salary';
      if (!showErrs(errs)) return;
      if (await lockedFrom(rec.effective_from)) return toast('An Approved or Locked month uses this rate period. Add a rate from a later month instead.', true);
      rec.dil_rate = num(rec.dil_rate); rec.monthly_salary = num(rec.monthly_salary); rec.token_no = Number(rec.token_no);
      rec.entered_by = S.user; const ap = can('approve'); rec.approved_by = ap ? S.user : null; rec.approved_on = ap ? new Date().toISOString() : null;
      delete rec.created_at; delete rec.updated_at;
      try { await DB.put('rate', [rec]); await auditDiff('pay_rate_history', `${rec.token_no}/${rec.effective_from}`, r, rec, ['dil_rate', 'monthly_salary', 'approved_by']); if (ap) await syncMaster(rec.token_no); closeModal(); toast('Rate saved'); go('rate'); }
      catch (x) { toast(x.message, true); }
    };
  }
  async function del(r) {
    if (await lockedFrom(r.effective_from)) return toast('An Approved or Locked month uses this rate period. It cannot be deleted.', true);
    confirmBox('Delete rate', `Delete the rate for ticket <b>${r.token_no}</b> from <b>${isoToDMY(r.effective_from)}</b>?`, async () => {
      await DB.del('rate', { token_no: r.token_no, effective_from: r.effective_from }); await audit('pay_rate_history', `${r.token_no}/${r.effective_from}`, '*', r.dil_rate, null, 'Deleted'); await syncMaster(r.token_no); toast('Deleted'); go('rate'); }, { danger: true, yes: 'Delete' });
  }
  if (ed) $('#bAdd').onclick = () => edit(null);
  if (ed) $('#bImp').onclick = async () => {
    const text = await pickFile('.csv'); if (!text) return; const rows = csvParse(text);
    const ap = can('approve'), now = new Date().toISOString(), errs = [];
    const recs = rows.map((r, i) => { const eff = /^\d{4}-/.test(r.effective_from) ? r.effective_from : dmyToIso(r.effective_from);
      if (!emps.find(e => e.token_no == r.token_no)) errs.push(`Row ${i + 2}: ticket ${r.token_no} not in master`);
      if (!eff || eff.slice(8) !== '01') errs.push(`Row ${i + 2}: effective_from must be the 1st of a month`);
      return { token_no: Number(r.token_no), effective_from: eff, dil_rate: num(r.dil_rate), monthly_salary: num(r.monthly_salary), entered_by: S.user, approved_by: ap ? S.user : null, approved_on: ap ? now : null }; });
    if (errs.length) return modal(`<h3>Import stopped</h3><div class="errmsg">${errs.slice(0, 30).map(esc).join('<br>')}</div><p class="muted">Columns: token_no, effective_from (DD-MM-YYYY), dil_rate, monthly_salary</p><div class="mfoot"><button class="btn" onclick="closeModal()">Close</button></div>`);
    confirmBox('Import rates', `${recs.length} rates will be saved${ap ? ' as approved' : ' as pending'}.`, async () => { await DB.put('rate', recs); if (ap) for (const t of new Set(recs.map(r => r.token_no))) await syncMaster(t); await audit('pay_rate_history', '*', 'import', null, `${recs.length} rows`, 'CSV import'); toast('Imported'); go('rate'); }, { yes: 'Import' });
  };
  if (can('approve')) $('#bApp').onclick = async () => {
    const pend = rates.filter(r => !r.approved_by); if (!pend.length) return toast('No pending rates');
    const own = pend.filter(r => r.entered_by === S.user && DB.mode === 'supabase');
    const list = pend.filter(r => !own.includes(r));
    confirmBox('Approve rates', `Approve ${list.length} pending rate(s)?${own.length ? ` ${own.length} entered by you are skipped; another checker must approve them.` : ''}`, async () => {
      const now = new Date().toISOString(); await DB.put('rate', list.map(r => ({ ...r, approved_by: S.user, approved_on: now })));
      for (const r of list) { await audit('pay_rate_history', `${r.token_no}/${r.effective_from}`, 'approved_by', null, S.user, 'Approved'); await syncMaster(r.token_no); } toast('Approved'); go('rate'); });
  };
};

function monthWorkers(emps, month) {
  const s = month, e = monthEnd(month);
  return emps.filter(x => x.status !== 'Pending' && x.d_o_j && x.d_o_j <= e && (!x.d_o_l || x.d_o_l >= s))
    .sort((a, b) => a.token_no - b.token_no);
}
function employedDays(emp, month) {
  const s = new Date(month), e = new Date(monthEnd(month));
  const a = emp.d_o_j && new Date(emp.d_o_j) > s ? new Date(emp.d_o_j) : s;
  const b = emp.d_o_l && new Date(emp.d_o_l) < e ? new Date(emp.d_o_l) : e;
  return Math.max(0, Math.round((b - a) / 86400000) + 1);
}

const ATT_F = [['w_days', 'W.Days'], ['fh', 'F/H'], ['al', 'P/L'], ['cl', 'C/L'], ['lwp', 'LWP'], ['abs', 'ABS'], ['act_ot_hrs', 'Act OT hrs']];

  const wd = WEEKDAY[String(P.WEEKLY_OFF || 'SUN').toUpperCase()], isOff = ds => wd !== undefined && new Date(ds.slice(0, 10) + 'T00:00:00Z').getUTCDay() === wd;

function attIssues(a, emp, p, P, rateOk, lv) {
  const err = [], warn = [], hard = [], bad = new Set();

  if (!emp) { H('Ticket No. not in master'); return { err, warn, hard, bad }; }
  if (emp.status === 'Pending') H('Employee not approved');
  for (const [k, l] of ATT_F) { const v = a[k] === '' || a[k] == null ? 0 : Number(a[k]);
    if (isNaN(v)) H(`${l} is not a number`, [k]);
    else if (v < 0) H(`${l} is negative`, [k]);
    else if (k === 'act_ot_hrs' ? !Number.isInteger(v) : !halfStep(v)) H(k === 'act_ot_hrs' ? `${l} must be whole hours, no decimals` : `${l} not in steps of 0.5`, [k]); }
  if (num(a.act_ot_hrs) > 0 && !(num(a.w_days) > 0)) H('OT hours are not allowed when W.Days is 0', ['act_ot_hrs']);
  const dayKeys = ATT_F.slice(0, 6).map(([k]) => k);
  const sum = dayKeys.reduce((s, k) => s + num(a[k]), 0), t = num(a.w_days) + num(a.fh) + num(a.al) + num(a.cl), dim = num(p.days_in_month);
  if (sum > dim) H(`Days entered ${days(sum)} are more than ${dim} days in the month`, dayKeys.filter(k => num(a[k]) > 0));
  const cal = empCal(emp, p, P, S.holList), emd = cal.emd;
  if (!cal.full && sum > emd) H(`Days total ${days(sum)} is more than ${emd} days employed in the month (${isoToDMY(cal.from)} to ${isoToDMY(cal.to)}${emp.d_o_j > p.pay_month ? ', joined ' + isoToDMY(emp.d_o_j) : ''}${emp.d_o_l && emp.d_o_l < monthEnd(p.pay_month) ? ', left ' + isoToDMY(emp.d_o_l) : ''}). Maximum ${cal.work} working days`, dayKeys.filter(k => num(a[k]) > 0));
  // leave cannot be above the available balance (opening of the month + credit of the month)
  if (lv) {
    if (r1(a.al) > lv.pl) H(`P/L ${days(a.al)} is more than the available PL balance of ${lvDays(lv.pl)} (${lv.src})`, ['al']);
    if (r1(a.cl) > lv.cl) H(`C/L ${days(a.cl)} is more than the available CL balance of ${lvDays(lv.cl)} (${lv.src})`, ['cl']);
  }
  if (!rateOk && (t > 0 || num(a.act_ot_hrs) > 0)) err.push(emp.pay_type === 'M' ? 'No approved monthly salary for the month' : 'No approved DIL rate for the month');
  if (!cal.full && sum <= emd && sum !== cal.work) warn.push(`Days total ${days(sum)} is ${sum > cal.work ? 'more' : 'less'} than the ${cal.work} working days employed in the month (${isoToDMY(cal.from)} to ${isoToDMY(cal.to)})`);
  if (sum <= dim && sum !== num(p.expected_days) && emd >= dim) { const all = sum + offDays(p); warn.push(`Days total ${days(all)}, with ${offLabel(p)}, is ${all > dim ? 'more' : 'less'} than the ${dim} days in the month`); }
  if (t === 0) warn.push('T.Days is 0');
  if (num(a.act_ot_hrs) > num(P.OT_HRS_LIMIT)) { warn.push(`OT ${a.act_ot_hrs} hrs is above the limit of ${P.OT_HRS_LIMIT}. Check the entry and accept the warning, or the Administrator can change OT_HRS_LIMIT in Payroll parameters`); }
  if (emp.pay_type === 'M' && num(a.act_ot_hrs) > 0) warn.push('OT hours for a monthly-salary worker are not paid (rule to be confirmed)');
  return { err, warn, hard, bad };
}

    const onEdit = i => { const tr = i.closest('tr'), t = Number(tr.dataset.t); dirty.add(t); updBar();

  const saveRows = async rows => {

    await DB.put('att', rows.map(r => ({ pay_month: p.pay_month, token_no: Number(r.token_no), ...Object.fromEntries(ATT_F.map(([k]) => [k, num(r[k])])), warnings_accepted: false })));

  if (ed) {

      if (stop.length) {
        const tr = $(`#tb tr[data-t="${stop[0].r.token_no}"]`); if (tr) { tr.scrollIntoView({ block: 'center' }); const b = tr.querySelector('input.bad'); if (b) b.focus(); }
        $('#live').className = 'errmsg'; $('#live').hidden = false;
        $('#live').innerHTML = `<b>Nothing was saved.</b> Correct ${stop.length} row(s) first:<br>` + stop.slice(0, 15).map(x => `${x.r.token_no} ${esc((empMap.get(x.r.token_no) || {}).name || '')}: ${esc(x.is.hard.join('; '))}`).join('<br>');
        return toast(`${stop.length} row(s) have days above the month, leave above the balance or invalid values. Nothing was saved.`, true);
      }
      try { await saveRows(rows); dirty.clear(); toast(`${rows.length} row(s) saved to the ${DB.mode === 'local' ? 'browser' : 'company database'}`); refresh(); } catch (x) { toast(x.message, true); } };
    $('#bSave2').onclick = () => $('#bSave').click();
    $('#bDisc').onclick = () => confirmBox('Discard changes', `Undo the changes in ${dirty.size} row(s)?`, async () => { dirty.clear(); typed.clear(); $('#tb').innerHTML = ''; updBar(); draw(); }, { yes: 'Discard', danger: true });
    S.unsaved = () => dirty.size; S.saveFn = () => $('#bSave').click();
    $('#bImp').onclick = async () => { const text = await pickFile('.csv'); if (!text) return; const rows = csvParse(text);
      if (!rows.length || !('token_no' in rows[0])) return toast('The file needs columns: token_no, w_days, fh, pl, cl, lwp, abs, act_ot_hrs', true);
      const recs = rows.map(r => { if (r.al === undefined && r.pl !== undefined) r.al = r.pl;   // P/L column (older files use al)
        return { token_no: Number(r.token_no), ...Object.fromEntries(ATT_F.map(([k]) => [k, r[k] === undefined || r[k] === '' ? 0 : Number(r[k])])) }; });
      const skip = [], probs = [];
      recs.forEach((r, i) => { const is = attIssues(r, empMap.get(r.token_no), p, P, rateOk(r.token_no), lvAv(r.token_no));
        if (is.hard.length) skip.push(`Row ${i + 2}, ticket ${r.token_no}: ${is.hard.join('; ')}`); else if (is.err.length) probs.push(`Row ${i + 2}, ticket ${r.token_no}: ${is.err.join('; ')}`); });
      const good = recs.filter(r => !attIssues(r, empMap.get(r.token_no), p, P, rateOk(r.token_no), lvAv(r.token_no)).hard.length);

        ${probs.length ? `<div class="note" style="max-height:160px;overflow:auto"><b>Saved, but must be corrected</b> before the month is complete:<br>${probs.slice(0, 200).map(esc).join('<br>')}</div>` : ''}

      $('#mC').onclick = closeModal; $('#mS').onclick = async () => { try { await saveRows(good); await audit('pay_attendance', p.pay_month, 'import', null, `${good.length} rows saved, ${skip.length} skipped`, 'CSV import'); closeModal(); toast(`${good.length} rows imported${skip.length ? `, ${skip.length} not saved` : ''}`, skip.length > 0); refresh(); } catch (x) { toast(x.message, true); } }; };

  }
  $('#bTpl').onclick = () => download(`attendance_${monthLabel(p.pay_month)}.csv`, toCsv(['token_no', 'name', ...ATT_F.map(([k]) => k === 'al' ? 'pl' : k)], workers.map(w => { const a = attMap.get(w.token_no) || {}; return { token_no: w.token_no, name: w.name, ...a, pl: a.al }; })), 'text/csv');

/* ===================== Monthly deductions ===================== */
PAGES.mded = async function () {
  const p = await curPeriod(); if (!p) return noMonth();

  const val = (t, c) => { const r = md.find(x => Number(x.token_no) === t && x.ded_code === c); return r ? num(r.amount) : 0; };
  const tokens = [...new Set([...workers.map(w => w.token_no), ...md.map(m => Number(m.token_no))])].sort((a, b) => a - b);
  const ed = can('attEdit') && editableStatus(p.status); const dirty = new Set();

    <p class="sub">Amounts in Rs. for the month. PF, P.Tax, ESI and LWF are calculated by the system and are not entered here.</p></div>
    ${!editableStatus(p.status) ? `<div class="note">The month is ${esc(p.status)}. Deductions are read-only.</div>` : ''}
    <div class="bar">${ed ? '<button class="btn pri" id="bSave">Save changes</button><button class="btn" id="bImp">Import CSV</button>' : ''}<button class="btn" id="bTpl">Download CSV template</button>${ed ? '<button class="btn dan" id="bClr">Clear month</button>' : ''}
      <span class="grow"></span><label class="muted"><input type="checkbox" id="fNz"> Only rows with amounts</label><input type="text" id="q" placeholder="Ticket or name" size="14"></div>
    <div class="tw"><table class="g"><thead><tr><th class="n">Ticket</th><th>Name</th><th>Dept</th>${types.map(d => `<th class="n">${esc(d.name)}</th>`).join('')}<th class="n">Total</th><th></th></tr></thead><tbody id="tb"></tbody>
    <tfoot id="tf"></tfoot></table></div>
    ${ed ? `<div class="savebar" id="sbar" hidden><span id="sbarTxt"></span><span style="flex:1"></span><button class="btn" id="bDisc">Discard changes</button><button class="btn pri" id="bSave2">Save changes</button><span style="color:#cfd2cf">Ctrl+S</span></div>` : ''}<div class="pagepad"></div>`;
  const updBar = () => { const b = $('#sbar'); if (!b) return; b.hidden = !dirty.size; $('#sbarTxt').textContent = `${dirty.size} worker(s) changed and not saved yet`; $('#bSave').textContent = dirty.size ? `Save changes (${dirty.size})` : 'Save changes'; };
  const draw = () => { const q = $('#q').value.toLowerCase(), nz = $('#fNz').checked;
    const list = tokens.filter(t => { const e = empMap.get(t) || {}; if (q && !String(t).includes(q) && !String(e.name || '').toLowerCase().includes(q)) return false; if (nz && !types.some(d => val(t, d.ded_code))) return false; return true; });

      return `<tr data-t="${t}"><td class="n">${t}</td><td>${esc(e.name || '(not in master)')}</td><td>${esc(e.dept_name || '')}</td>
        ${types.map(d => `<td class="n">${ed ? `<input data-c="${d.ded_code}" value="${val(t, d.ded_code) || ''}" inputmode="decimal" style="width:64px">` : blankInr(val(t, d.ded_code))}</td>`).join('')}
        <td class="n" data-tot>${blankInr(tot)}</td><td>${ed && md.some(m => Number(m.token_no) === t) ? `<button class="btn sm dan" data-d="${t}">Delete</button>` : ''}</td></tr>`; }).join('');
    const gt = types.map(d => md.filter(m => m.ded_code === d.ded_code).reduce((s, m) => s + num(m.amount), 0));
    $('#tf').innerHTML = `<tr class="tot"><td></td><td>Saved total</td><td></td>${gt.map(v => `<td class="n">${blankInr(v)}</td>`).join('')}<td class="n">${blankInr(gt.reduce((a, b) => a + b, 0))}</td><td></td></tr>`;
    $('#tb').querySelectorAll('input').forEach(i => i.oninput = () => { const tr = i.closest('tr'); dirty.add(Number(tr.dataset.t)); updBar();

    $('#bImp').onclick = async () => { const text = await pickFile('.csv'); if (!text) return; const rows = csvParse(text); if (!rows.length) return;

      confirmBox('Import deductions', `${recs.length} amounts read. Zero amounts remove existing entries.`, async () => { await save(recs); await audit('pay_monthly_deduction', p.pay_month, 'import', null, `${recs.length} amounts`, 'CSV import'); toast('Imported'); refresh(); }, { yes: 'Import' }); };
    $('#bClr').onclick = () => confirmBox('Clear month', `Delete all ${md.length} deduction entries of ${monthLabel(p.pay_month)}?`, async () => {

/* ===================== Leave balances ===================== */
/* A/L in attendance is PL (master field pl_clb). C/L is CL (master field cl_clb).
   pay_leave_register: one row per worker per approved month (month_year).
     Opening = closing of the worker's previous row, or the master balance when there is no earlier row.
     Closing = Opening + Credit - Availed. The master always holds the closing of the latest row.
   pay_leave_credit: credits entered for a month before approval; copied into the register on approval.
   Months are posted and reversed in order: a month cannot be returned while a later month is approved. */

  m.forEach(a => a.sort((x, y) => x.month_year < y.month_year ? -1 : 1));

/* Opening balances from "DUROPLY".worker_leave_opening, keyed by ticket. Loaded before any leave work. */

/* Opening for a month: the previous register row; with no earlier row, worker_leave_opening; else the master */

  if (w) return { pl: r1(w.pl_opb), cl: r1(w.cl_opb), src: 'Opening table' };

/* Current balance of a worker: closing of the latest register row; with no row, the opening as above */
function lvCurrent(emp, rows) {

    const ne = { ...e, pl_clb: r1(v.pl), cl_clb: r1(v.cl) }; delete ne.created_at; delete ne.updated_at; out.push(ne);
    if (pc) aud.push(lvAuditRow(t, 'pl_clb', e.pl_clb, r1(v.pl), reason));
    if (cc) aud.push(lvAuditRow(t, 'cl_clb', e.cl_clb, r1(v.cl), reason)); });

/* Approval: write the month to the register and its closing balances to the master */
async function lvPost(p, lines) {

/* Return to Calculated: remove the month from the register; the master goes back to the month's opening */
async function lvReverse(p, reason) {

  const n = await lvSetMaster(emps, new Map(rows.map(r => [Number(r.token_no), { pl: r.pl_opb, cl: r.cl_opb }])), `Leave closing ${monthLabel(p.pay_month)} reversed${reason ? ': ' + reason : ''}`);

/* Master = closing of the worker's latest register row */
async function lvSyncMaster(tokens, reason) {

function lvTotals(rows) {

/* ===================== Payroll calculation ===================== */
const DED_KEY = { Advance: 'ADV', Canteen: 'CAN', Dress: 'DRS', Other: 'OTH' };

}
function buildLines(p, C, method) {
  const P = { ...C.P, OT_METHOD: method || String(C.P.OT_METHOD).toUpperCase() };
  const empMap = new Map(C.emps.map(e => [e.token_no, e])), colOf = new Map(C.dts.map(d => [d.ded_code, DED_KEY[d.register_column] || 'OTH']));
  const runId = uid();
  return C.att.map(a => {
    const t = Number(a.token_no), emp = empMap.get(t);
    if (!emp) return { pay_month: p.pay_month, token_no: t, name: '(not in master)', errors: 'Ticket No. not in master', calc_run_id: runId };
    const ded = {}; C.md.filter(m => Number(m.token_no) === t).forEach(m => { const k = colOf.get(m.ded_code) || 'OTH'; ded[k] = (ded[k] || 0) + num(m.amount); });
    const rate = Engine.resolveRate(C.rates, t, p.pay_month);
    const cal = empCal(emp, p, P, C.hol || []);
    const L = Engine.calcLine({ emp, att: a, rate, P, period: p, ded, slabs: C.slabs, holidays: cal.hols, outside: num(p.days_in_month) - cal.emd });
    const errs = Engine.lineChecks(L);
    const payable = num(a.w_days) + num(a.fh) + num(a.al) + num(a.cl) > 0 || num(a.act_ot_hrs) > 0;
    if (payable && emp.pay_type !== 'M' && !(rate && num(rate.dil_rate) > 0)) errs.push('No approved DIL rate');
    if (payable && emp.pay_type === 'M' && !(rate && num(rate.monthly_salary) > 0)) errs.push('No approved monthly salary');

function exceptions(lines, p, C) {
  const out = [], add = (type, l, info) => out.push({ type, token_no: l.token_no, name: l.name, info });
  const gov = num(C.P.GOV_RATE), thr = C.slabs.map(s => num(s.from_amount)).filter(v => v > 0);
  const changed = new Set(C.rates.filter(r => r.effective_from === p.pay_month).map(r => Number(r.token_no)));
  const empMap = new Map(C.emps.map(e => [e.token_no, e]));
  lines.forEach(l => {
    if (l.errors) add('Error', l, l.errors);
    if (l.pay_type === 'D' && num(l.dil_rate) > 0 && num(l.dil_rate) < gov) add('DIL rate below Gov rate', l, `DIL ${l.dil_rate}, Gov ${gov}`);
    if (num(l.fine) > 0) add('Fine (negative OT adjustment)', l, `Fine ${inr(l.fine)}`);
    if (num(l.t_days) === 0) add('T.Days = 0', l, 'Nil pay; check whether the worker has left');
    const tot = num(l.w_days) + num(l.fh) + num(l.al) + num(l.cl) + num(l.lwp) + num(l.abs);
    if (tot !== num(p.expected_days)) add('Day-types not equal to expected days', l, `${days(tot)} of ${days(p.expected_days)}`);
    if (l.pay_type === 'D' && Math.abs(num(l.short_excess)) > num(l.gov_hourly) + 0.5 && num(l.gov_hourly) > 0) add('Short/Excess above Gov hourly rate', l, inr(l.short_excess, 2));
    thr.forEach(tv => { if (num(l.total_earnings) > 0 && Math.abs(num(l.total_earnings) - tv) <= 100) add('Total Earnings near P.Tax threshold', l, `${inr(l.total_earnings)} vs ${inr(tv)}`); });
    if (changed.has(Number(l.token_no))) add('Rate changed this month', l, `DIL ${l.dil_rate}`);
    const e = empMap.get(Number(l.token_no)); if (num(l.pf) > 0 && e && !e.uan_no) add('PF deducted but no UAN', l, '');
    if (C.P.ESI_ON === 'Y' && e && e.esi_applicable === 'Y' && l.pay_type === 'D' && num(l.t_days) > 0 && num(l.esi) === 0 && num(C.P.ESI_CEILING) > 0 && num(l.dil_rate) * (num(C.P.ESI_DAYS) || 26) > num(C.P.ESI_CEILING))
      add('ESIC wages above ceiling', l, `${inr(num(l.dil_rate) * (num(C.P.ESI_DAYS) || 26))} vs ceiling ${inr(C.P.ESI_CEILING)}; no ESIC deducted`);
    if (C.P.ESI_ON === 'Y' && e && e.esi_applicable === 'Y' && num(l.esi) > 0 && !e.esi_no) add('ESIC deducted but no ESI No.', l, '');
  });
  return out;
}

async function saveSnapshot(p, lines, reason) {
  if (!lines.length) throw new Error('The month has no payroll lines to save.');
  const T = totals(lines), runs = await load('run', { pay_month: p.pay_month });
  const lastRun = runs.sort((a, b) => a.run_on < b.run_on ? 1 : -1)[0];
  const snap = { snapshot_id: uid(), pay_month: p.pay_month, taken_on: new Date().toISOString(), taken_by: S.user, reason,
    locked_by: p.locked_by || null, locked_on: p.locked_on || null, pf_deposit_date: p.pf_deposit_date || null, approved_by: p.approved_by || null,
    calc_run_id: lastRun ? lastRun.calc_run_id : null, line_count: lines.length,
    totals: { basic: T.basic, ot: T.ot, fine: T.fine, total_earnings: T.total_earnings, pf: T.pf, ptax: T.ptax, esi: T.esi, lwf: T.lwf, total_ded: T.total_ded, net_payable: T.net_payable, eps: T.eps, er_pf_diff: T.er_pf_diff },
    lines: lines.map(l => Object.fromEntries(LINE_COLS.map(c => [c, l[c] === undefined ? null : l[c]]))) };
  await DB.ins('snap', [snap]);
  await audit('pay_register_snapshot', p.pay_month, 'snapshot', null, `${lines.length} lines, Net Rs. ${inr(T.net_payable)}`, reason);
  return snap;
}

  snaps.sort((a, b) => a.taken_on < b.taken_on ? 1 : -1);
  const head = `<div class="titlerow"><h1>Locked vs revised ${monthLabel(p.pay_month)}</h1><p class="sub">Compares a locked pay register, saved when the month was unlocked, with the figures now in the system. All figures in Rs.</p></div>`;
  if (!snaps.length) { $('#main').innerHTML = head + `<div class="okmsg">${monthLabel(p.pay_month)} has not been unlocked after locking, so there is nothing to compare. A copy of the register is saved automatically whenever a locked month is unlocked.</div>`; return; }
  $('#main').innerHTML = head + `<div class="bar"><label>Locked version <select id="vSel">${snaps.map((s, i) => `<option value="${i}">${isoToDMY(s.taken_on.slice(0, 10))} ${new Date(s.taken_on).toTimeString().slice(0, 5)}, unlocked by ${esc(s.taken_by)}</option>`).join('')}</select></label>
      <label><input type="checkbox" id="vAll"> Show unchanged workers</label><span class="grow"></span><button class="btn" id="bX">Export Excel</button><button class="btn" id="bP">Print</button></div><div id="out"></div>`;
  const nm = t => (emps.find(e => e.token_no === t) || {}).name || '';
  const draw = () => {
    const s = snaps[+$('#vSel').value], old = new Map(s.lines.map(l => [Number(l.token_no), l])), now = new Map(cur.map(l => [Number(l.token_no), l]));
    const toks = [...new Set([...old.keys(), ...now.keys()])].sort((a, b) => a - b);
    const K = ['t_days', 'total_earnings', 'pf', 'ptax', 'total_ded', 'net_payable'];
    const rows = toks.map(t => { const o = old.get(t), n = now.get(t), g = (x, k) => x ? num(x[k]) : 0;
      const dif = Object.fromEntries(K.map(k => [k, g(n, k) - g(o, k)])), erd = (g(n, 'eps') + g(n, 'er_pf_diff')) - (g(o, 'eps') + g(o, 'er_pf_diff'));
      const res = !o ? 'Added' : !n ? 'Removed' : dif.net_payable > 0 ? 'Arrears to pay' : dif.net_payable < 0 ? 'Recovery' : K.some(k => dif[k] !== 0) || erd !== 0 ? 'Changed, same net' : 'No change';
      return { t, name: (n || o).name || nm(t), o, n, dif, erd, res }; });
    const show = $('#vAll').checked ? rows : rows.filter(r => r.res !== 'No change');
    const sum = f => rows.reduce((a, r) => a + f(r), 0);
    const arrears = sum(r => Math.max(r.dif.net_payable, 0)), recovery = sum(r => Math.min(r.dif.net_payable, 0));
    const pfEe = sum(r => r.dif.pf), pfEr = sum(r => r.erd), pt = sum(r => r.dif.ptax);
    const changed = rows.filter(r => r.res !== 'No change').length;
    const cell = (v, sign) => sign ? `<td class="n" style="${v < 0 ? 'color:var(--err)' : ''}">${v ? (v > 0 ? '+' : '') + inr(v) : ''}</td>` : `<td class="n">${blankInr(v)}</td>`;
    $('#out').innerHTML = `<div class="printhead"><b>DUROPLY INDUSTRIES LIMITED, SHAPAR</b><br>Locked vs revised pay register | ${monthName(p.pay_month)} | All figures in Rs. | Printed ${todayDMY()}</div>
      <div class="card"><b>Locked version:</b> saved ${isoToDMY(s.taken_on.slice(0, 10))} by ${esc(s.taken_by)}. Reason for unlock: ${esc(s.reason)}. It was locked by ${esc(s.locked_by || '-')}${s.locked_on ? ' on ' + isoToDMY(s.locked_on.slice(0, 10)) : ''}; PF deposited ${isoToDMY(s.pf_deposit_date) || '-'}. ${s.line_count} lines.<br>
      <b>Current figures:</b> ${cur.length} lines, status ${esc(p.status)}${['Approved', 'Locked'].includes(p.status) ? '' : ' (not yet approved; figures can still change)'}.</div>
      <div class="tw" style="max-height:none;max-width:780px"><table class="g"><thead><tr><th>Summary</th><th class="n">Locked</th><th class="n">Current</th><th class="n">Difference</th></tr></thead><tbody>
      ${[['Total Earnings', 'total_earnings'], ['PF Ded. (employee)', 'pf'], ['P.Tax', 'ptax'], ['Total Ded.', 'total_ded'], ['Net Payable', 'net_payable']].map(([l, k]) => { const a = num(s.totals[k]), b = totals(cur)[k]; return `<tr><td>${l}</td><td class="n">${inr(a)}</td><td class="n">${inr(b)}</td>${cell(b - a, 1)}</tr>`; }).join('')}
      <tr><td>Workers changed</td><td></td><td></td><td class="n">${changed}</td></tr>
      <tr><td>Arrears to pay (workers paid less before)</td><td></td><td></td>${cell(arrears, 1)}</tr>
      <tr><td>Recovery (workers paid more before)</td><td></td><td></td>${cell(recovery, 1)}</tr>
      <tr><td>PF difference, employee share</td><td></td><td></td>${cell(pfEe, 1)}</tr>
      <tr><td>PF difference, employer share (EPS + EPF)</td><td></td><td></td>${cell(pfEr, 1)}</tr>
      <tr><td>P.Tax difference</td><td></td><td></td>${cell(pt, 1)}</tr></tbody></table></div>
      <h2>By worker</h2><div class="tw"><table class="g"><thead><tr><th class="n">Ticket</th><th>Name</th><th class="n">T.Days locked</th><th class="n">T.Days now</th><th class="n">Earnings locked</th><th class="n">Earnings now</th><th class="n">Earnings diff</th>
        <th class="n">PF diff</th><th class="n">ER PF diff</th><th class="n">P.Tax diff</th><th class="n">Net locked</th><th class="n">Net now</th><th class="n">Net diff</th><th>Result</th></tr></thead><tbody>
      ${show.map(r => `<tr class="${r.res === 'Recovery' ? 'err' : r.res === 'Arrears to pay' ? 'warn' : ''}"><td class="n">${r.t}</td><td>${esc(r.name)}</td><td class="n">${r.o ? days(r.o.t_days) || '0' : ''}</td><td class="n">${r.n ? days(r.n.t_days) || '0' : ''}</td>
        <td class="n">${r.o ? inr(r.o.total_earnings) : ''}</td><td class="n">${r.n ? inr(r.n.total_earnings) : ''}</td>${cell(r.dif.total_earnings, 1)}${cell(r.dif.pf, 1)}${cell(r.erd, 1)}${cell(r.dif.ptax, 1)}
        <td class="n">${r.o ? inr(r.o.net_payable) : ''}</td><td class="n">${r.n ? inr(r.n.net_payable) : ''}</td>${cell(r.dif.net_payable, 1)}<td>${esc(r.res)}</td></tr>`).join('') || '<tr><td colspan="14" class="muted">No worker has a different figure.</td></tr>'}
      </tbody></table></div>
      <p class="muted">Arrears and recoveries are not paid or deducted by the system. Settle them outside payroll or as a deduction or payment in a later month, and deposit any PF difference. A positive difference means more is due; a negative one means less.`;
    $('#bX').onclick = () => { const aoa = [['DUROPLY INDUSTRIES LIMITED, SHAPAR'], [`Locked vs revised pay register | ${monthName(p.pay_month)} | All figures in Rs.`], [`Locked version saved ${isoToDMY(s.taken_on.slice(0, 10))} by ${s.taken_by}; reason: ${s.reason}`], [],
      ['Ticket No', 'Name', 'T.Days locked', 'T.Days now', 'Earnings locked', 'Earnings now', 'Earnings diff', 'PF diff', 'ER PF diff', 'P.Tax diff', 'Net locked', 'Net now', 'Net diff', 'Result'],
      ...show.map(r => [r.t, r.name, r.o ? num(r.o.t_days) : null, r.n ? num(r.n.t_days) : null, r.o ? num(r.o.total_earnings) : null, r.n ? num(r.n.total_earnings) : null, r.dif.total_earnings, r.dif.pf, r.erd, r.dif.ptax, r.o ? num(r.o.net_payable) : null, r.n ? num(r.n.net_payable) : null, r.dif.net_payable, r.res]),
      [], ['Arrears to pay', arrears], ['Recovery', recovery], ['PF difference, employee', pfEe], ['PF difference, employer', pfEr], ['P.Tax difference', pt]];
      xlsxExport(`Locked_vs_Revised_${monthLabel(p.pay_month)}.xlsx`, [{ name: 'Comparison', aoa, widths: [10, 28, 10, 10, 13, 13, 12, 10, 10, 10, 12, 12, 12, 16] }]); };
  };
  $('#vSel').onchange = draw; $('#vAll').onchange = draw; draw(); $('#bP').onclick = () => window.print();
};

/* ===================== Dashboard ===================== */
PAGES.dash = async function () {
  const [emps, rates, periods, lines] = await Promise.all([load('emp'), load('rate'), load('period'), load('line')]);
  const p = periods.find(x => x.pay_month === S.month);
  const L = p ? lines.filter(l => l.pay_month === p.pay_month) : [];
  const att = p ? await load('att', { pay_month: p.pay_month }) : [];
  const act = emps.filter(e => (e.status || 'Active') === 'Active').length, pend = emps.filter(e => e.status === 'Pending').length, pr = rates.filter(r => !r.approved_by).length;
  const months = [...new Set(lines.map(l => l.pay_month))].sort().slice(-6);
  const next = !p ? [S.firstMonth ? 'Start the first payroll month' : S.blockReason || 'Select the pay month at the top', 'period'] : { 'Open': ['Enter attendance and mark it complete', 'att'], 'Attendance Complete': ['Enter deductions and run the calculation', 'calc'],
    'Calculated': ['Review exceptions; HR Checker approves', 'calc'], 'Approved': ['Pay wages, record the PF deposit and lock', 'calc'], 'Locked': ['Select the next month at the top', 'period'] }[p.status];
  $('#main').innerHTML = `<h1>Dashboard${p ? ' ' + monthLabel(p.pay_month) : ''}</h1><p class="sub">${p ? `Month status: <b>${esc(p.status)}</b>.` : 'No pay month is open.'} Next step: <a href="#" id="nx">${esc(next[0])}</a>.</p>
    ${!p ? startPanel() : ''}
    ${L.length ? kpiHtml(totals(L)) : ''}
    <div class="kpis"><div class="kpi"><div class="v">${act}</div><div class="l">Active employees</div></div><div class="kpi"><div class="v">${pend}</div><div class="l">Employees pending approval</div></div>
      <div class="kpi"><div class="v">${pr}</div><div class="l">Rates pending approval</div></div><div class="kpi"><div class="v">${att.length}</div><div class="l">Attendance rows this month</div></div></div>
    ${months.length ? `<h2>Last ${months.length} months, Rs. Lacs</h2><div class="tw" style="max-height:none;max-width:760px"><table class="g"><thead><tr><th>Month</th><th class="n">Workers</th><th class="n">Basic</th><th class="n">O.T.</th><th class="n">Total Earnings</th><th class="n">PF</th><th class="n">Net Payable</th></tr></thead><tbody>
      ${months.map(m => { const t = totals(lines.filter(l => l.pay_month === m)); return `<tr><td>${monthLabel(m)}</td><td class="n">${t.count}</td><td class="n">${lacs(t.basic)}</td><td class="n">${lacs(t.ot)}</td><td class="n">${lacs(t.total_earnings)}</td><td class="n">${lacs(t.pf)}</td><td class="n">${lacs(t.net_payable)}</td></tr>`; }).join('')}</tbody></table></div>` : ''}
    ${!emps.length ? '<div class="note">The employee master is empty. Go to Employees and import rajkot_emp_master.csv.</div>' : ''}`;
  $('#nx').onclick = e => { e.preventDefault(); go(next[1]); };
  bindStart();
};

/* ===================== Admin ===================== */
PAGES.users = async function () {
  const roleTable = `<table class="g" style="max-width:760px"><thead><tr><th>Payroll role</th><th>Can do</th></tr></thead><tbody>
    <tr><td>Operator</td><td>Masters, attendance, deductions, calculation, draft reports</td></tr><tr><td>Checker</td><td>Approve employees and rates, approve payroll, return an approved month</td></tr>
    <tr><td>Accounts</td><td>View reports, record PF deposit, lock the month</td></tr><tr><td>Admin</td><td>Everything, including parameters, P.Tax slab, unlock and delete month</td></tr></tbody></table>`;
  if (DB.mode === 'local') { $('#main').innerHTML = `<h1>Users and roles</h1><div class="note">Standalone run. The user is fixed as ${esc(STANDALONE_USER.name)} (${esc(STANDALONE_USER.role)}). When Payroll is opened from the App Launcher, the launcher's sign-in and user profile are used instead.</div>${roleTable}`; return; }
  if (!can('admin')) { $('#main').innerHTML = `<h1>Users and roles</h1><p class="sub">Only the Administrator can assign payroll roles.</p>${roleTable}`; return; }
  const nk = v => String(v || '').replace(/^\s*(mr|mrs|ms|miss|dr|shri|smt)\.?\s+/i, '').trim().toLowerCase();
  const rows = (await load('role')).sort((a, b) => nk(a.name || a.email).localeCompare(nk(b.name || b.email), 'en', { sensitivity: 'base' }));
  let profs = []; try { const { data } = await SupaDB.sb.from('user_profiles').select('auth_id,name,role,contact_email'); profs = (data || []).filter(p => p.auth_id); } catch (e) { profs = []; }
  const isLAdmin = p => String(p.role || '').toLowerCase() === 'admin';
  const admins = profs.filter(isLAdmin).sort((a, b) => nk(a.name).localeCompare(nk(b.name), 'en', { sensitivity: 'base' }));
  const adminIds = new Set(admins.map(p => p.auth_id));
  const adminRows = admins.map(p => `<tr><td>${esc(p.name)}</td><td>${esc(p.contact_email || '')}</td><td><b>Admin (launcher)</b></td><td class="muted">Set in App Launcher</td></tr>`).join('');
  $('#main').innerHTML = `<h1>Users and roles</h1><p class="sub">Users sign in through the App Launcher. Launcher admins are payroll Admins automatically. Other users need a payroll role here.</p>
    <div class="bar"><button class="btn pri" id="bAdd">Assign a role</button></div>
    <div class="tw" style="max-width:860px"><table class="g"><thead><tr><th>Name</th><th>Email</th><th>Payroll role</th><th></th></tr></thead><tbody>
    ${adminRows}${rows.map((r, i) => adminIds.has(r.user_id) ? '' : `<tr><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td><select data-i="${i}">${['Pending', 'Operator', 'Checker', 'Accounts', 'Admin'].map(x => `<option ${x === r.role ? 'selected' : ''}>${x}</option>`).join('')}</select></td><td><button class="btn sm dan" data-d="${i}">Remove</button></td></tr>`).join('') || (adminRows ? '' : '<tr><td colspan="4" class="muted">No payroll roles assigned yet.</td></tr>')}</tbody></table></div>
    <h2>Payroll roles</h2>${roleTable}`;
  $('#main').querySelectorAll('select[data-i]').forEach(s => s.onchange = async () => { const r = rows[s.dataset.i]; try { await DB.put('role', [{ user_id: r.user_id, email: r.email, name: r.name, role: s.value }]); await audit('pay_user_role', r.email || r.user_id, 'role', r.role, s.value); toast('Role saved'); } catch (x) { toast(x.message, true); } });
  $('#main').querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const r = rows[b.dataset.d]; confirmBox('Remove payroll role', `Remove the payroll role of ${esc(r.name || r.email)}? The launcher login is not changed.`, async () => { await DB.del('role', { user_id: r.user_id }); await audit('pay_user_role', r.email || r.user_id, 'role', r.role, null, 'Removed'); go('users'); }, { danger: true, yes: 'Remove' }); });
  $('#bAdd').onclick = () => {
    const sortKey = p => String(p.name || '').replace(/^\s*(mr|mrs|ms|miss|dr|shri|smt)\.?\s+/i, '').trim().toLowerCase();   // ignore Mr./Ms. etc.
    const opts = profs.filter(p => !isLAdmin(p) && !rows.find(r => r.user_id === p.auth_id));
    const list = profs.filter(p => isLAdmin(p) || !rows.find(r => r.user_id === p.auth_id))
      .sort((a, b) => sortKey(a).localeCompare(sortKey(b), 'en', { sensitivity: 'base' }));
    modal(`<h3>Assign a payroll role</h3><div class="form">
      ${profs.length ? `<label class="full"><span>User (from launcher user profiles) <b>*</b></span><select id="uP"><option value=""></option>${list.map(p => isLAdmin(p)
        ? `<option value="" disabled>${esc(p.name)}${p.contact_email ? ' - ' + esc(p.contact_email) : ''} (Admin, launcher)</option>`
        : `<option value="${esc(p.auth_id)}">${esc(p.name)}${p.contact_email ? ' - ' + esc(p.contact_email) : ''}</option>`).join('')}</select></label>`
        : `<label class="full"><span>Supabase Auth user ID <b>*</b></span><input type="text" id="uId" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></label><label><span>Name <b>*</b></span><input type="text" id="uN"></label><label>Email<input type="text" id="uE"></label>
           <p class="full muted">The user list could not be read from user_profiles, so enter the user's auth ID (Supabase > Authentication > Users).</p>`}
      <label><span>Payroll role <b>*</b></span><select id="uR"><option>Operator</option><option>Checker</option><option>Accounts</option><option>Admin</option></select></label></div>
      <div class="mfoot"><button class="btn" id="mC">Cancel</button><button class="btn pri" id="mS">Save</button></div>`);
    $('#mC').onclick = closeModal;
    $('#mS').onclick = async () => {
      let rec;
      if (profs.length) { const p = opts.find(x => x.auth_id === $('#uP').value); if (!p) return toast('Choose a user', true); rec = { user_id: p.auth_id, name: p.name, email: p.contact_email || '', role: $('#uR').value }; }
      else { const id = $('#uId').value.trim(), n = $('#uN').value.trim(); if (!/^[0-9a-f-]{36}$/i.test(id) || !n) return toast('Enter a valid auth user ID and a name', true); rec = { user_id: id, name: n, email: $('#uE').value.trim(), role: $('#uR').value }; }
      try { await DB.put('role', [rec]); await audit('pay_user_role', rec.email || rec.user_id, 'role', null, rec.role, 'Assigned'); closeModal(); toast('Role assigned'); go('users'); } catch (x) { toast(x.message, true); }
    };
  };
};
PAGES.audit = async function () {
  let rows = await load('audit'); rows.sort((a, b) => a.logged_at < b.logged_at ? 1 : -1); rows = rows.slice(0, 1000);
  const tables = [...new Set(rows.map(r => r.table_name))].sort();
  $('#main').innerHTML = `<h1>Audit log</h1><p class="sub">Latest ${rows.length} changes. Entries cannot be edited or deleted.</p>
    <div class="bar"><select id="aT"><option value="">All tables</option>${tables.map(t => `<option>${esc(t)}</option>`).join('')}</select><input type="text" id="q" placeholder="Record, user or value"><span class="grow"></span><button class="btn" id="bX">Export CSV</button></div>
    <div class="tw"><table class="g"><thead><tr><th>Time</th><th>User</th><th>Table</th><th>Record</th><th>Field</th><th>Old</th><th>New</th><th>Reason</th></tr></thead><tbody id="tb"></tbody></table></div>`;
  const draw = () => { const t = $('#aT').value, q = $('#q').value.toLowerCase();
    const L = rows.filter(r => (!t || r.table_name === t) && (!q || [r.record_key, r.user_email, r.old_value, r.new_value, r.reason].some(v => String(v ?? '').toLowerCase().includes(q))));
    $('#tb').innerHTML = L.map(r => { const d = new Date(r.logged_at); return `<tr><td>${isoToDMY(r.logged_at.slice(0, 10))} ${d.toTimeString().slice(0, 5)}</td><td>${esc(r.user_email)}</td><td>${esc(r.table_name)}</td><td>${esc(r.record_key)}</td><td>${esc(r.field)}</td>
      <td title="${esc(r.old_value)}">${esc(String(r.old_value ?? '').slice(0, 40))}</td><td title="${esc(r.new_value)}">${esc(String(r.new_value ?? '').slice(0, 40))}</td><td>${esc(r.reason)}</td></tr>`; }).join('') || '<tr><td colspan="8" class="muted">No entries.</td></tr>';
    $('#bX').onclick = () => download('audit_log.csv', toCsv(['logged_at', 'user_email', 'table_name', 'record_key', 'field', 'old_value', 'new_value', 'reason'], L), 'text/csv'); };
  $('#aT').onchange = draw; $('#q').oninput = draw; draw();
};
PAGES.backup = async function () {
  const local = DB.mode === 'local';
  $('#main').innerHTML = `<h1>Backup and restore</h1><p class="sub">${local ? 'Data in this mode lives only in this browser. Export a backup after every working session.' : 'The company database is backed up by Supabase. You can also export a copy here.'}</p>
    <div class="bar"><button class="btn pri" id="bE">Export backup (JSON)</button>${local && can('admin') ? '<button class="btn" id="bI">Restore from backup</button><button class="btn dan" id="bW">Erase all local data</button>' : ''}</div>
    <p class="muted">The backup contains personal data (Aadhaar, PAN, bank details). Store it securely.</p>`;
  $('#bE').onclick = async () => { const out = {}; for (const t of Object.keys(TBL)) { if (t === 'role' && local) continue; try { out[t] = await load(t); } catch (e) { out[t] = []; } }
    download(`duroply_payroll_backup_${todayDMY()}.json`, JSON.stringify({ exported: new Date().toISOString(), mode: DB.mode, data: out })); };
  if (local && can('admin')) {
    $('#bI').onclick = async () => { const text = await pickFile('.json'); if (!text) return; let j; try { j = JSON.parse(text); } catch (e) { return toast('Not a valid backup file', true); }
      confirmBox('Restore backup', `Replace all local data with the backup from ${esc(isoToDMY((j.exported || '').slice(0, 10)))}?`, async () => {
        for (const t of Object.keys(TBL)) if (t !== 'role') LocalDB.write(t, (j.data && j.data[t]) || []); S.month = null; await startApp(); toast('Restored'); }, { danger: true, yes: 'Restore' }); };
    $('#bW').onclick = () => confirmBox('Erase all local data', 'Delete every table in this browser? Export a backup first.', async () => { Object.keys(TBL).forEach(t => localStorage.removeItem(LocalDB.key(t))); await seedLocal(); S.month = null; await startApp(); }, { danger: true, yes: 'Erase' });
  }
};
